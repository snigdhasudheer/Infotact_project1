
name: Python API Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest test_api.py -v

      - name: Run utility tests
        run: |
          python -m unittest test_export_product_month.py -v
          python -m unittest test_validate_upload.py -v
          python -m unittest test_validate_product_month_csv.py -v
